<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- Straightline's backdrop: realmstate.net's hero texture, fainter. An ink wash (soft, uneven pools of dark navy)
       under a fine film grain. No direction, so no streaks. Tiles seamlessly. Configuration > Texture turns it off. -->
  <filter id="wash" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency=".008" numOctaves="3" seed="14" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .02  0 0 0 0 .03  0 0 0 0 .07  1.8 0 0 0 -.15"/>
  </filter>
  <filter id="film" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="6" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0 .3 0 0"/></feComponentTransfer>
  </filter>
  <rect width="400" height="400" filter="url(#wash)" opacity=".08"/>
  <rect width="400" height="400" filter="url(#film)" opacity=".3"/>
</svg>
